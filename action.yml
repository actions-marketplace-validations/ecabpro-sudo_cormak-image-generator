name: "Cormak Image Generator"
author: Cormak
description: "Generate images from text with Cormak for websites and static assets."
branding:
  icon: image
  color: black
inputs:
  request_id:
    description: "Stable UUID for one operation. Reuse it unchanged on retries."
    required: true
  allow_paid:
    description: "Explicit opt-in to a charge against Cormak credits."
    required: false
    default: "false"
  max_credits:
    description: "Maximum credits accepted for a new generation."
    required: false
    default: ""
  prompt:
    description: "Image description, 3 to 1500 characters for a new run."
    required: false
    default: ""
  model:
    description: "nano2, nano-pro, seedream, or nano."
    required: false
    default: "nano2"
  quality:
    description: "standard or high, according to the selected model."
    required: false
    default: "standard"
  aspect_ratio:
    description: "1:1, 3:4, 4:3, 16:9 or 9:16."
    required: false
    default: "1:1"
  resume_only:
    description: "Read and download an existing operation without starting generation."
    required: false
    default: "false"
  output_path:
    description: "New path under generated/. File stem; extension is detected."
    required: false
    default: "generated/image"
outputs:
  request_id:
    description: The operation UUID.
  status:
    description: complete or awaiting_confirmation.
  output_path:
    description: Workspace path of the draft, when complete.
  credits_charged:
    description: Credits reported by Cormak, when available.
runs:
  using: node24
  main: main.mjs
